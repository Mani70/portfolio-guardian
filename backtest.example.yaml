# Backtest settings. Copy to backtest.yaml to customise.

years: 5                    # history to test (downloaded once, then cached in cache/history/)
capital: 500000             # starting money, ₹
max_positions: 5            # at most this many stocks at once; each gets equity / max_positions
stop_atr: 3.0               # protective stop = entry - 3 x ATR(14)
max_hold: 0                 # force exit after N trading days (0 = no limit)
out_of_sample_pct: 30       # last 30% of the period is reported separately
fd_rate: 6.25               # SBI 1-year FD rate, for comparison
cash_yield: 6.0             # idle cash earns this (liquid fund), in every strategy
benchmark: NIFTYBEES        # buy-and-hold comparison (Nifty 50 ETF)

# Universe: Nifty 50 constituents as of 2025. Edit to match the current index.
# Symbols INDstocks can't find are skipped with a warning.
# Using today's index members to test the past flatters results (survivorship bias).
universe:
  - ADANIENT
  - ADANIPORTS
  - APOLLOHOSP
  - ASIANPAINT
  - AXISBANK
  - BAJAJ-AUTO
  - BAJFINANCE
  - BAJAJFINSV
